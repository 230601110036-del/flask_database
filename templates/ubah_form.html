<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<title>Ubah Reservasi</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="form-page">

<div class="form-container">

<h1>✏️ Ubah Reservasi</h1>

<form method="POST">

<label>Nama Pelanggan</label>

<input
type="text"
name="nama"
value="{{ data.nama }}"
required>

<label>Nomor Telepon</label>

<input
type="text"
name="telepon"
value="{{ data.telepon }}"
required>

<label>Paket Foto</label>

<select name="paket">

<option selected>
{{ data.paket }}
</option>

<option>Basic</option>
<option>Premium</option>
<option>Wedding</option>
<option>Graduation</option>
<option>Family</option>

</select>

<label>Tanggal Pemotretan</label>

<input
type="date"
name="tanggal"
value="{{ data.tanggal }}"
required>

<label>Jam Reservasi</label>

<input
type="time"
name="jam"
value="{{ data.jam }}"
required>

<button type="submit">

Simpan Perubahan

</button>

</form>

<a href="{{ url_for('index') }}"
class="back-button">

← Kembali

</a>

</div>

<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>

</html>
